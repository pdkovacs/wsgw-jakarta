quarkus.application.name=e2e-app

# E2EAPP_SERVER_PORT controls the HTTP listener.
quarkus.http.port=${E2EAPP_SERVER_PORT:8080}
quarkus.http.host=0.0.0.0

# Iter 1: HTTP/1.1 only. Iter 2 will flip these for h2c toward wsgw.
# quarkus.http.http2=${E2EAPP_HTTP2:false}
# quarkus.http.insecure-requests=enabled

# Logging: include MDC fields populated by RequestContextFilter.
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %X %s%e%n
quarkus.log.level=INFO
quarkus.log.category."io.github.pdkovacs.wsgw".level=DEBUG
