version: "3"

includes:
  # Internal: listed (and run directly) as e2e:app:image; here only so app can depend on it
  app:
    taskfile: ../../app/taskfile.yaml
    dir: ../../app
    internal: true
  driver:
    taskfile: ../../driver/taskfile.yaml
    dir: ../../driver
    internal: true

tasks:
  app:
    desc: Build the e2e app's image and (re)deploy it into the current kubectl namespace
    cmds:
      - task: app:image
      - kubectl apply -f ./app/e2e-app.yaml
      # The tag is the same on every build: restart so the pods pick up the new image
      - kubectl rollout restart deployment/wsgw-e2e-app
      - kubectl rollout status deployment/wsgw-e2e-app --timeout=120s

  driver:
    desc: Build the e2e driver's image and (re)deploy it into the current kubectl namespace
    cmds:
      - task: driver:image
      - kubectl apply -f ./driver/e2e-driver.yaml
      # The tag is the same on every build: restart so the pods pick up the new image
      - kubectl rollout restart deployment/wsgw-e2e-driver
      - kubectl rollout status deployment/wsgw-e2e-driver --timeout=120s
